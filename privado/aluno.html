<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Universitário - Área do Aluno</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="cabecalho">
        <h1>Portal Universitário</h1>
        <span>Área do aluno</span>
    </header>

    <div class="container">
        <aside class="menu">
            <h2>Menu</h2>
            <nav>
                <a href="/aluno">Início</a>
                <a href="#informacoes">Dados acadêmicos</a>
                <button id="btnSair" type="button">Sair do sistema</button>
            </nav>
        </aside>

        <main class="conteudo">
            <h2>Bem-vindo ao Portal Universitário</h2>
            <p>Confira suas informações acadêmicas.</p>

            <section id="informacoes" class="card">
                <h3>Informações Acadêmicas</h3>

                <p>Nome: <span id="nome"></span></p>
                <p>RA: <span id="ra"></span></p>
                <p>Curso: <span id="curso"></span></p>
                <p>Período: <span id="periodo"></span></p>
                <p>E-mail: <span id="email"></span></p>
                <p>Situação: <span id="situacao"></span></p>
            </section>
        </main>
    </div>

    <script src="js/aluno.js"></script>

</body>

</html>
